<!doctype html>
<!--
  Local preview for the animated SVGs. Open this file in a browser to check the
  animations without pushing to GitHub. It is not rendered by GitHub and can be
  deleted at any time.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>README2 asset preview</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 40px 24px;
    background: #05070d;
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #94a3b8;
  }
  .wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 34px; }
  h2 { color: #38bdf8; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 10px; font-weight: 600; }
  img { display: block; max-width: 100%; }
  .row { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .note { border-left: 2px solid #1e3a8a; padding-left: 14px; color: #64748b; }
</style>
</head>
<body>
<div class="wrap">
  <section>
    <h2>hero.svg</h2>
    <img src="hero.svg" alt="Hero banner" />
  </section>

  <section>
    <h2>divider.svg</h2>
    <img src="divider.svg" alt="Divider" />
  </section>

  <section>
    <h2>terminal.svg &nbsp;·&nbsp; 14s loop</h2>
    <div class="row"><img src="terminal.svg" alt="Terminal card" /></div>
  </section>

  <p class="note">
    Reload the page to restart every animation from t=0.<br />
    The terminal card runs a 14&nbsp;second cycle, the hero tagline an 8&nbsp;second cycle.
  </p>
</div>
</body>
</html>
