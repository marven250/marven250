<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Marven Mathelier - building dependable systems, one commit at a time">
  <title>Marven Mathelier</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a2242"/>
    </linearGradient>

    <radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-440 0; 440 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="180" y2="280">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="280" rx="16"/>
    </clipPath>

    <clipPath id="typeClip">
      <rect x="60" y="164" width="0" height="28">
        <animate attributeName="width" calcMode="discrete" dur="8s" repeatCount="indefinite"
          values="0;0;20;40;60;80;100;120;140;160;180;200;220;240;260;280;300;320;340;360;380;400;420;440;460;480;500;500;500;500;500;500;500;500;500;500;0"
          keyTimes="0;0.02;0.045;0.07;0.095;0.12;0.145;0.17;0.195;0.22;0.245;0.27;0.295;0.32;0.345;0.37;0.395;0.42;0.445;0.47;0.495;0.52;0.545;0.57;0.595;0.62;0.645;0.68;0.71;0.74;0.77;0.8;0.83;0.86;0.89;0.97;1"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- base -->
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- drifting aurora -->
    <g filter="url(#softGlow)">
      <ellipse cx="180" cy="70" rx="300" ry="190" fill="url(#blobBlue)">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 90 40; -40 60; 0 0" dur="18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="760" cy="220" rx="330" ry="200" fill="url(#blobCyan)">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; -110 -50; 60 -30; 0 0" dur="22s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="500" cy="30" rx="240" ry="130" fill="url(#blobAmber)">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 140 30; -120 20; 0 0" dur="26s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- data streams -->
    <g stroke-linecap="round">
      <line x1="0" y1="248" x2="1000" y2="248" stroke="#38bdf8" stroke-opacity="0.12"/>
      <line x1="0" y1="258" x2="1000" y2="258" stroke="#38bdf8" stroke-opacity="0.07"/>

      <circle cy="248" r="2.6" fill="#38bdf8" filter="url(#glow)">
        <animate attributeName="cx" values="-30;1030" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cy="248" r="1.8" fill="#f59e0b" filter="url(#glow)">
        <animate attributeName="cx" values="-30;1030" dur="9s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cy="258" r="1.8" fill="#06b6d4" filter="url(#glow)">
        <animate attributeName="cx" values="1030;-30" dur="11s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ambient sparks -->
    <g fill="#e0f2fe">
      <circle cx="120" cy="220" r="1.4">
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="46" r="1.6">
        <animate attributeName="opacity" values="0.9;0.15;0.9" dur="4.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="470" cy="232" r="1.2">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="58" r="1.5">
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="5.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="946" cy="42" r="1.3">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============ orbit system ============ -->
    <g transform="translate(838 138)">
      <circle r="86" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1"/>
      <circle r="62" fill="none" stroke="#38bdf8" stroke-opacity="0.13" stroke-width="1"/>
      <circle r="38" fill="none" stroke="#38bdf8" stroke-opacity="0.11" stroke-width="1"/>

      <!-- expanding pulse -->
      <circle r="22" fill="none" stroke="#38bdf8" stroke-width="1.4">
        <animate attributeName="r" values="22;92" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- orbiting nodes -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="16s" repeatCount="indefinite"/>
        <circle cx="86" cy="0" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="120;-240" dur="11s" repeatCount="indefinite"/>
        <circle cx="62" cy="0" r="3.6" fill="#f59e0b" filter="url(#glow)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="240;600" dur="7s" repeatCount="indefinite"/>
        <circle cx="38" cy="0" r="3" fill="#06b6d4" filter="url(#glow)"/>
      </g>

      <!-- core -->
      <circle r="22" fill="#0b1220" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.85"/>
      <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" font-weight="700" fill="#e0f2fe" letter-spacing="1">MM</text>
    </g>

    <!-- ============ text block ============ -->

    <!-- status pill -->
    <g>
      <rect x="60" y="46" width="196" height="26" rx="13" fill="#38bdf8" fill-opacity="0.09" stroke="#38bdf8" stroke-opacity="0.3"/>
      <circle cx="76" cy="59" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="90" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" fill="#7dd3fc" letter-spacing="1.4">AVAILABLE / BUILDING</text>
    </g>

    <!-- name -->
    <text x="58" y="126" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="54" font-weight="800" fill="url(#shine)" letter-spacing="-1">Marven Mathelier</text>

    <!-- animated rule -->
    <rect x="60" y="142" width="0" height="2.5" rx="1.25" fill="url(#rule)">
      <animate attributeName="width" values="0;470;470;0" keyTimes="0;0.25;0.9;1" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- typed tagline -->
    <g clip-path="url(#typeClip)">
      <text x="62" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="17" fill="#cbd5e1">$ building dependable systems</text>
    </g>
    <rect y="168" width="9" height="20" fill="#38bdf8">
      <animate attributeName="x" calcMode="discrete" dur="8s" repeatCount="indefinite"
        values="62;62;82;102;122;142;162;182;202;222;242;262;282;302;322;342;362;382;402;422;442;462;482;502;522;542;562;562;562;562;562;562;562;562;562;562;62"
        keyTimes="0;0.02;0.045;0.07;0.095;0.12;0.145;0.17;0.195;0.22;0.245;0.27;0.295;0.32;0.345;0.37;0.395;0.42;0.445;0.47;0.495;0.52;0.545;0.57;0.595;0.62;0.645;0.68;0.71;0.74;0.77;0.8;0.83;0.86;0.89;0.97;1"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#94a3b8">
      <g>
        <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.2s" fill="freeze"/>
        <rect x="60" y="212" width="104" height="24" rx="6" fill="#ffffff" fill-opacity="0.045" stroke="#38bdf8" stroke-opacity="0.18"/>
        <text x="112" y="228" text-anchor="middle">automation</text>
      </g>
      <g>
        <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.45s" fill="freeze"/>
        <rect x="172" y="212" width="88" height="24" rx="6" fill="#ffffff" fill-opacity="0.045" stroke="#38bdf8" stroke-opacity="0.18"/>
        <text x="216" y="228" text-anchor="middle">systems</text>
      </g>
      <g>
        <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.7s" fill="freeze"/>
        <rect x="268" y="212" width="112" height="24" rx="6" fill="#ffffff" fill-opacity="0.045" stroke="#38bdf8" stroke-opacity="0.18"/>
        <text x="324" y="228" text-anchor="middle">reliability</text>
      </g>
      <g>
        <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.95s" fill="freeze"/>
        <rect x="388" y="212" width="86" height="24" rx="6" fill="#ffffff" fill-opacity="0.045" stroke="#38bdf8" stroke-opacity="0.18"/>
        <text x="431" y="228" text-anchor="middle">tooling</text>
      </g>
    </g>

    <!-- travelling sheen across the whole card -->
    <rect x="-200" y="0" width="200" height="280" fill="url(#sheen)">
      <animate attributeName="x" values="-200;1000" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- border -->
    <rect x="0.5" y="0.5" width="999" height="279" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.22"/>
  </g>
</svg>
