<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="Terminal session: whoami returns marven250, IT and automation; focus.md lists current priorities">
  <title>~/marven250 — live session</title>

  <defs>
    <linearGradient id="tWin" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0c1524"/>
      <stop offset="100%" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="tBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0e1729"/>
    </linearGradient>
    <linearGradient id="tEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="tScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="tFrame">
      <rect x="1" y="1" width="518" height="298" rx="12"/>
    </clipPath>

    <!-- typing mask: whoami -->
    <clipPath id="c1">
      <rect x="60" y="50" width="0" height="22">
        <animate attributeName="width" calcMode="discrete" dur="14s" repeatCount="indefinite"
          values="0;0;8;16;24;32;40;50;50;0"
          keyTimes="0;0.030;0.043;0.056;0.069;0.082;0.095;0.108;0.970;1"/>
      </rect>
    </clipPath>

    <!-- typing mask: cat focus.md -->
    <clipPath id="c2">
      <rect x="60" y="102" width="0" height="22">
        <animate attributeName="width" calcMode="discrete" dur="14s" repeatCount="indefinite"
          values="0;0;8;16;24;32;40;48;56;64;72;80;88;96;96;0"
          keyTimes="0;0.240;0.252;0.264;0.276;0.288;0.300;0.312;0.324;0.336;0.348;0.360;0.372;0.384;0.970;1"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#tFrame)">
    <rect x="1" y="1" width="518" height="298" fill="url(#tWin)"/>

    <!-- title bar -->
    <rect x="1" y="1" width="518" height="34" fill="url(#tBar)"/>
    <circle cx="24" cy="18" r="5" fill="#ef4444" fill-opacity="0.85"/>
    <circle cx="42" cy="18" r="5" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="60" cy="18" r="5" fill="#22c55e" fill-opacity="0.85">
      <animate attributeName="fill-opacity" values="0.85;0.3;0.85" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="260" y="22" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11.5" fill="#64748b" letter-spacing="0.6">marven250 — zsh</text>
    <line x1="1" y1="35" x2="519" y2="35" stroke="#38bdf8" stroke-opacity="0.14"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">

      <!-- line 1: prompt + whoami -->
      <g opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.030;0.970;1" dur="14s" repeatCount="indefinite"/>
        <text x="24" y="66" fill="#22d3ee">~ $</text>
        <g clip-path="url(#c1)">
          <text x="60" y="66" fill="#e2e8f0">whoami</text>
        </g>
      </g>

      <!-- line 2: output -->
      <g opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.150;0.970;1" dur="14s" repeatCount="indefinite"/>
        <text x="24" y="92" fill="#94a3b8">marven250 <tspan fill="#475569">·</tspan> <tspan fill="#cbd5e1">IT &amp; automation</tspan></text>
      </g>

      <!-- line 3: prompt + cat focus.md -->
      <g opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.215;0.970;1" dur="14s" repeatCount="indefinite"/>
        <text x="24" y="118" fill="#22d3ee">~ $</text>
        <g clip-path="url(#c2)">
          <text x="60" y="118" fill="#e2e8f0">cat focus.md</text>
        </g>
      </g>

      <!-- output block -->
      <g opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.430;0.970;1" dur="14s" repeatCount="indefinite"/>
        <text x="24" y="150" fill="#38bdf8">→ <tspan fill="#cbd5e1">make repetitive work disappear</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.480;0.970;1" dur="14s" repeatCount="indefinite"/>
        <text x="24" y="176" fill="#38bdf8">→ <tspan fill="#cbd5e1">strengthen scripting + systems</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.530;0.970;1" dur="14s" repeatCount="indefinite"/>
        <text x="24" y="202" fill="#38bdf8">→ <tspan fill="#cbd5e1">turn lessons into documentation</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.580;0.970;1" dur="14s" repeatCount="indefinite"/>
        <text x="24" y="228" fill="#38bdf8">→ <tspan fill="#cbd5e1">smallest reliable fix that holds</tspan></text>
      </g>

      <!-- trailing prompt -->
      <g opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.640;0.970;1" dur="14s" repeatCount="indefinite"/>
        <text x="24" y="262" fill="#22d3ee">~ $</text>
        <rect x="60" y="250" width="8" height="16" fill="#38bdf8">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- scanline -->
    <rect x="1" y="0" width="518" height="70" fill="url(#tScan)">
      <animate attributeName="y" values="-70;300" dur="6s" repeatCount="indefinite"/>
    </rect>

    <rect x="1" y="1" width="518" height="298" rx="12" fill="none" stroke="url(#tEdge)" stroke-width="1.5"/>
  </g>
</svg>
